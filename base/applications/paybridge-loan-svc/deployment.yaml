apiVersion: apps/v1
kind: Deployment
metadata:
  name: paybridge-loan-svc
  namespace: paybridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paybridge-loan-svc
  template:
    metadata:
      labels:
        app: paybridge-loan-svc
    spec:
      containers:
        - name: paybridge-loan-svc
          image: dentamuhajir/paybridge-loan-svc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          # env:
          #   - name: OTEL_SDK_DISABLED
          #     value: "true"
          envFrom:
            - configMapRef:
                name: paybridge-loan-svc-config
            - secretRef:
                name: paybridge-loan-svc-secret
          # Optional: health checks (recommended for Spring Boot)
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 15
          #   failureThreshold: 3