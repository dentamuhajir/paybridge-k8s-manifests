apiVersion: apps/v1
kind: Deployment
metadata:
  name: paybridge-otel-collector
  namespace: paybridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paybridge-otel-collector
  template:
    metadata:
      labels:
        app: paybridge-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.96.0
          args:
            - "--config=/etc/otel-collector-config.yaml"

          ports:
            - containerPort: 4317
            - containerPort: 4318

          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml

      volumes:
        - name: otel-config
          configMap:
            name: paybridge-otel-collector-config